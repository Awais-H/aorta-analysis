[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "branchseed"
version = "0.1.0"
description = "CPU-only aortic daughter branch seed proposal pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "SimpleITK>=2.3",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "psutil>=5.9",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.8"]
tracking = ["scikit-image>=0.24"]
advanced = ["itk>=5.4"]

[project.scripts]
branchseed = "branchseed.run:main"
branchseed-ablation = "branchseed.ablation:main"
branchseed-phantoms = "branchseed.phantoms:main"

[tool.hatch.build.targets.wheel]
packages = ["branchseed"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
